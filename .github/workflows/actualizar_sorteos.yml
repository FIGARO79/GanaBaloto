name: Actualizar Resultados Baloto

on:
  schedule:
    # Corre los martes, jueves y domingos a las 12:00 PM hora de Colombia (17:00 UTC)
    - cron: '0 17 * * 0,2,4'
  workflow_dispatch: # Permite ejecución manual desde la web de GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 tabulate lxml

      - name: Run update script
        env:
          AUTO_UPDATE: "true"
        run: |
          python actualizar_resultados.py

      - name: Commit and push changes
        id: commit-step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add baloto.json
          
          # Verificar si el archivo baloto.json cambió
          if git diff --cached --quiet; then
            echo "No se detectaron nuevos sorteos. Repositorio al día."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "🤖 Actualización automática de sorteos [GitHub Actions]"
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to PythonAnywhere (Free Account API)
        # Solo ejecutar si se detectaron cambios y el commit se realizó con éxito
        if: steps.commit-step.outputs.has_changes == 'true'
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USER: "ganabaloto"
          PA_DOMAIN: "ganabaloto.pythonanywhere.com"
        run: |
          echo "[SISTEMA] Subiendo baloto.json actualizado a PythonAnywhere..."
          
          # Subir el archivo baloto.json a la ruta /home/ganabaloto/baloto.json
          curl -s -X POST \
            -H "Authorization: Token $PA_TOKEN" \
            -F "content=@baloto.json" \
            https://www.pythonanywhere.com/api/v0/user/$PA_USER/files/path/home/$PA_USER/baloto.json
          
          echo "[SISTEMA] Recargando la Web App en PythonAnywhere..."
          
          # Recargar la aplicación web para que Flask refresque los datos en memoria
          curl -s -X POST \
            -H "Authorization: Token $PA_TOKEN" \
            https://www.pythonanywhere.com/api/v0/user/$PA_USER/webapps/$PA_DOMAIN/reload/
          
          echo "[SISTEMA] Despliegue completado con éxito."
