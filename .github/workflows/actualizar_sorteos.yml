name: Actualizar Resultados Baloto

on:
  schedule:
    # Corre los martes, jueves y domingos a las 12:00 PM hora de Colombia (17:00 UTC)
    - cron: '0 17 * * 0,2,4'
  workflow_dispatch: # Permite ejecución manual desde la web de GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 tabulate lxml

      - name: Run update script
        env:
          AUTO_UPDATE: "true"
        run: |
          python actualizar_resultados.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add baloto.json
          
          # Verificar si el archivo baloto.json cambió
          if git diff --cached --quiet; then
            echo "No se detectaron nuevos sorteos. Repositorio al día."
          else
            git commit -m "🤖 Actualización automática de sorteos [GitHub Actions]"
            git push
          fi
